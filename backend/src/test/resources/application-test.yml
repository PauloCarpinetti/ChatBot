spring:
  application:
    name: chatbot-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Configurações do LLM Mock
llm:
  provider: openai
  api-key: test-api-key
  base-url: http://localhost:8089 # para wiremock

logging:
  level:
    br.com.paulo.chatbot: DEBUG
