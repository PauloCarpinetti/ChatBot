spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:chat_tenant_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:chat_user}
    password: ${MYSQL_PASSWORD:Hepta2020#}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:chat_tenant_db}
    user: ${MYSQL_USER:chat_user}
    password: ${MYSQL_PASSWORD:Hepta2020#}

server:
  port: 8081

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: gpt-4o-mini
    streaming-chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: gpt-4o-mini
    embedding-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: text-embedding-3-small

chatbot:
  weaviate:
    host: ${WEAVIATE_HOST:localhost}
    port: ${WEAVIATE_PORT:8090}
    scheme: http

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyDoNotUseInProd}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    dev.langchain4j: DEBUG
