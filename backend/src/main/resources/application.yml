spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:chat_tenant_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:chat_user}
    password: ${MYSQL_PASSWORD:chat_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:chat_tenant_db}
    user: ${MYSQL_USER:chat_user}
    password: ${MYSQL_PASSWORD:chat_password}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: gpt-4o-mini
    embedding-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: text-embedding-3-small

chatbot:
  weaviate:
    host: localhost
    port: ${WEAVIATE_PORT:8090}
    scheme: http
